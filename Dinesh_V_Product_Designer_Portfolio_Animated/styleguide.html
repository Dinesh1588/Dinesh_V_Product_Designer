<!doctype html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinesh V — Portfolio Style Guide</title><link rel="stylesheet" href="./src/styles/tokens.css"><link rel="stylesheet" href="./src/styles/typography.css"><style>body{padding:40px;background:var(--bg);color:var(--text)}main{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.swatch{height:100px;padding:12px;border-radius:12px}.panel{padding:28px;border:1px solid var(--border);border-radius:20px;margin:20px 0;background:var(--surface)}button{padding:12px 18px;border-radius:999px;border:1px solid var(--border);background:var(--orange-500);color:#fff}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><p class="eyebrow">DINESH V · PORTFOLIO SYSTEM</p><h1>Orange / Dark-first</h1><p style="color:var(--muted);margin-top:20px">Dark mode is the default. Light mode is an intentional alternate theme.</p><div class="panel"><h2>Orange scale</h2><div class="grid" id="swatches"></div></div><div class="panel"><h2>Typography</h2><h3>Product thinking, made visible.</h3><p style="color:var(--body)">Body copy uses Inter. Display headings use Space Grotesk.</p></div><div class="panel"><h2>Theme</h2><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">Toggle light / dark</button></div></main><script>const c={50:'#FFF7ED',100:'#FFEDD5',200:'#FED7AA',300:'#FDBA74',400:'#FB923C',500:'#F97316',600:'#EA580C',700:'#C2410C',800:'#9A3412',900:'#7C2D12'};document.querySelector('#swatches').innerHTML=Object.entries(c).map(([k,v])=>`<div class="swatch" style="background:${v};color:${+k>500?'#fff':'#171717'}"><b>${k}</b><br>${v}</div>`).join('')</script></body></html>
